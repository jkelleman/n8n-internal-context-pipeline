# Opt-in queue mode: the main n8n process receives webhooks and enqueues executions in Redis;
# workers run them. n8n only supports queue mode on PostgreSQL.
#   docker compose -f docker-compose.yml -f docker-compose.queue.yml up -d --scale n8n-worker=2
# Each worker runs up to N8N_WORKER_CONCURRENCY executions at once; extra executions wait in Redis.
x-queue-env: &queue-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_HEALTH_CHECK_ACTIVE: "true"
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  n8n-import:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *queue-env

  n8n:
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *queue-env

  n8n-worker:
    image: n8nio/n8n:2.44.7
    restart: unless-stopped
    command: ["worker", "--concurrency=${N8N_WORKER_CONCURRENCY:-5}"]
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      <<: *queue-env
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      GENERIC_TIMEZONE: UTC
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n-files
    volumes:
      - n8n_files:/home/node/.n8n-files
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5678/healthz"]
      interval: 5s
      timeout: 3s
      retries: 40

volumes:
  postgres_data:
  redis_data:
