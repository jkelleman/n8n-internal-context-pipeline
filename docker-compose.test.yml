# E2E override: swaps external APIs for deterministic mocks. Used by test/e2e/run.sh.
services:
  mocks:
    image: node:22-alpine
    environment:
      MOCK_EMBEDDING_DIMENSIONS: "64"
      PORT: "9090"
    ports:
      - 127.0.0.1:${MOCKS_HOST_PORT:-19090}:9090
    volumes:
      - ./test/mocks:/app:ro
    command: ["node", "/app/server.mjs"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  pipeline-init:
    environment:
      EMBEDDING_DIMENSIONS: "64"

  n8n:
    depends_on:
      mocks:
        condition: service_healthy
    environment:
      EMBEDDINGS_BASE_URL: http://mocks:9090/v1
      EMBEDDINGS_API_KEY: test-embeddings-key
      ANTHROPIC_BASE_URL: http://mocks:9090
      ANTHROPIC_API_KEY: test-anthropic-key
      NOTION_BASE_URL: http://mocks:9090
      NOTION_API_KEY: test-notion-key
      SLACK_WEBHOOK_URL: http://mocks:9090/slack
