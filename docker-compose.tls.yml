# Opt-in TLS: publishes only n8n's production webhooks over HTTPS through Caddy.
#   N8N_PUBLIC_HOST=n8n.example.com docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
# For a public hostname, ports 80/443 must be reachable so Caddy can obtain a certificate.
services:
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      N8N_PUBLIC_HOST: ${N8N_PUBLIC_HOST:?set N8N_PUBLIC_HOST to the public hostname}
    ports:
      - ${PROXY_HTTP_PORT:-80}:80
      - ${PROXY_HTTPS_PORT:-443}:443
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  n8n:
    environment:
      WEBHOOK_URL: https://${N8N_PUBLIC_HOST}/
      # Trust X-Forwarded-* from exactly one proxy hop.
      N8N_PROXY_HOPS: "1"

volumes:
  caddy_data:
  caddy_config:
